[project]
name = "resume-cli"
version = "0.1.0"
description = "AI 简历解析 CLI —— 读取 PDF 简历，调用 Claude 提取结构化信息并按 JD 匹配评分"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pypdf>=4.0",
    "typer>=0.12",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
resume-cli = "resume_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
